<div id="qixia-route-preview">
  <div class="viz-controls">
    <label class="form-label">预览状态
      <select class="form-select" id="qr-mode"><option value="official">官方路线详情</option><option value="custom">专属路线 · 已规划</option><option value="active">游览进行中</option></select>
    </label>
    <span class="text-small text-muted">路线列表局部预览 · 示例顺序</span>
  </div>
  <div class="viz-dotted-background qr-stage">
    <section class="qr-product" aria-label="枫叶精灵路线样式">
      <header class="qr-header"><div><p class="qr-eyebrow">南京 · 栖霞山</p><h2>我的路线</h2></div><button class="qr-history"><i data-lucide="history" aria-hidden="true"></i>历史行程</button></header>
      <nav class="qr-tabs" aria-label="路线类型"><button data-mode="official">官方推荐</button><button data-mode="custom">专属路线</button></nav>
      <div class="qr-title"><p class="qr-eyebrow" id="qr-category"></p><h3>一程山色，半日清闲</h3><p id="qr-description"></p></div>
      <div class="qr-summary"><span><i data-lucide="arrow-right" aria-hidden="true"></i>西门进入</span><span><i data-lucide="flag" aria-hidden="true"></i>西门离开</span><span>3 处景点</span></div>
      <div class="qr-section-heading"><h4 id="qr-list-title">沿途风景</h4><button id="qr-edit" hidden>编辑停留时间</button><span id="qr-count"></span></div>
      <ol class="qr-timeline" id="qr-stops"></ol>
      <div class="qr-footer"><p id="qr-hint"></p><button class="qr-main" id="qr-action"></button><button class="qr-secondary" id="qr-skip" hidden>跳过本站</button></div>
      <p class="qr-feedback" id="qr-feedback" role="status" aria-live="polite"></p>
      <div id="qr-history-view" hidden><div class="qr-history-heading"><h3>走过的栖霞</h3><button id="qr-close-history" aria-label="关闭历史行程"><i data-lucide="x" aria-hidden="true"></i></button></div><p>一程山色，半日清闲</p><div class="qr-memory"><button data-memory="游览报告"><i data-lucide="file-text" aria-hidden="true"></i>游览报告</button><button data-memory="专属手账"><i data-lucide="book-open" aria-hidden="true"></i>专属手账</button></div><p id="qr-memory-feedback" role="status"></p></div>
    </section>
  </div>
</div>
<style>
#qixia-route-preview{color-scheme:light dark}
#qixia-route-preview .qr-stage{margin-top:16px;padding:22px 12px}
#qixia-route-preview .qr-product{--qr-ink:light-dark(#352f2a,#eee5dc);--qr-soft:light-dark(#776e65,#c0b3a7);--qr-bg:light-dark(#fffefa,#26221f);--qr-line:light-dark(#eadfd6,#52483f);--qr-red:light-dark(#963e38,#e4a098);--qr-tint:light-dark(#fbf0eb,#402d29);--qr-green:light-dark(#47765b,#a3c7a9);--qr-orange:light-dark(#ae692e,#e0b17e);--qr-gap:22px;--qr-track:3px;max-width:590px;margin:auto;background:var(--qr-bg);color:var(--qr-ink);border:1px solid var(--qr-line);border-radius:24px;padding:26px;font-family:system-ui,"Microsoft YaHei",sans-serif;box-shadow:0 12px 36px #00000008;position:relative;overflow-wrap:anywhere}
#qixia-route-preview .qr-product *{box-sizing:border-box}
#qixia-route-preview .qr-product h2,#qixia-route-preview .qr-product h3,#qixia-route-preview .qr-product h4,#qixia-route-preview .qr-product p{margin:0}
#qixia-route-preview .qr-product button{font:inherit;cursor:pointer;color:inherit;border:0;background:transparent;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
#qixia-route-preview .qr-product button:focus-visible{outline:2px solid var(--qr-red);outline-offset:3px}
#qixia-route-preview .qr-product svg{width:17px;height:17px;flex-shrink:0}
#qixia-route-preview .qr-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
#qixia-route-preview .qr-header h2{font:400 27px/1.5 Georgia,"Songti SC",SimSun,serif}
#qixia-route-preview .qr-eyebrow{color:var(--qr-soft);font-size:12px;line-height:1.8;letter-spacing:1px}
#qixia-route-preview .qr-product .qr-history{font-size:12px;color:var(--qr-soft)}
#qixia-route-preview .qr-tabs{display:flex;background:var(--qr-tint);padding:4px;border-radius:16px;margin-bottom:24px;gap:4px}
#qixia-route-preview .qr-tabs button{flex:1;font-size:14px;border-radius:12px}
#qixia-route-preview .qr-tabs button[aria-pressed=true]{background:var(--qr-bg);color:var(--qr-red);box-shadow:0 2px 5px #00000006}
#qixia-route-preview .qr-title h3{font:400 24px/1.6 Georgia,"Songti SC",SimSun,serif;margin:4px 0}
#qixia-route-preview .qr-title>p:last-child{font-size:13px;color:var(--qr-soft);line-height:1.9}
#qixia-route-preview .qr-summary{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:12px;padding:16px 0 20px;border-bottom:1px solid var(--qr-line);color:var(--qr-soft)}
#qixia-route-preview .qr-summary span{display:flex;align-items:center;gap:6px}
#qixia-route-preview .qr-summary span:first-child svg{color:var(--qr-green)}
#qixia-route-preview .qr-summary span:nth-child(2) svg{color:var(--qr-orange)}
#qixia-route-preview .qr-section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px;min-height:44px}
#qixia-route-preview .qr-section-heading h4{font-weight:500;font-size:14px}
#qixia-route-preview .qr-section-heading>span,#qixia-route-preview .qr-section-heading button{font-size:12px;color:var(--qr-soft)}
#qixia-route-preview .qr-timeline{list-style:none;margin:0;padding:0}
#qixia-route-preview .qr-stop{display:grid;grid-template-columns:32px minmax(0,1fr);column-gap:12px;position:relative;padding-bottom:var(--qr-gap)}
#qixia-route-preview .qr-stop:last-child{padding-bottom:0}
#qixia-route-preview .qr-rail{position:relative;display:flex;justify-content:center;padding-top:16px;color:var(--qr-red)}
#qixia-route-preview .qr-stop:not(:last-child) .qr-rail:after{content:"";position:absolute;top:27px;bottom:-18px;width:var(--qr-track);background:var(--qr-red);opacity:.36}
#qixia-route-preview .qr-stop.is-done .qr-rail:after{background:var(--qr-green);opacity:.6}
#qixia-route-preview .qr-stop.is-future .qr-rail:after{background:var(--qr-line);opacity:1}
#qixia-route-preview .qr-dot{width:13px;height:13px;border:3px solid currentColor;border-radius:50%;background:var(--qr-bg);z-index:1;display:grid;place-items:center}
#qixia-route-preview .qr-rail.is-gate .qr-dot,#qixia-route-preview .is-done .qr-dot{width:27px;height:27px;border:0;margin-top:-6px}
#qixia-route-preview .is-start .qr-rail,#qixia-route-preview .is-done .qr-rail{color:var(--qr-green)}
#qixia-route-preview .is-end .qr-rail{color:var(--qr-orange)}
#qixia-route-preview .is-next .qr-dot{box-shadow:0 0 0 5px var(--qr-tint);background:var(--qr-red)}
#qixia-route-preview .is-future .qr-dot{border-color:var(--qr-line)}
#qixia-route-preview .qr-stop-body{padding:0 12px 4px;min-width:0;border-radius:13px}
#qixia-route-preview .is-selected .qr-stop-body,#qixia-route-preview .is-next .qr-stop-body{background:var(--qr-tint)}
#qixia-route-preview .qr-stop-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
#qixia-route-preview .qr-product .qr-name{justify-content:flex-start;text-align:left;font:400 18px/1.5 Georgia,"Songti SC",SimSun,serif;padding:0}
#qixia-route-preview .qr-status{font-size:11px;color:var(--qr-soft);flex-shrink:0}
#qixia-route-preview .is-next .qr-status{color:var(--qr-red)}
#qixia-route-preview .qr-stop-note{font-size:12px;color:var(--qr-soft);line-height:1.7}
#qixia-route-preview .qr-product .qr-intro{font-size:12px;color:var(--qr-red);min-height:32px;padding:0}
#qixia-route-preview .qr-stay{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;padding:6px 0;color:var(--qr-soft)}
#qixia-route-preview .qr-stay select{font:inherit;padding:8px;background:var(--qr-bg);color:var(--qr-ink);border:1px solid var(--qr-line);border-radius:8px}
#qixia-route-preview .qr-footer{border-top:1px solid var(--qr-line);margin-top:22px;padding-top:16px;display:flex;flex-wrap:wrap;gap:10px}
#qixia-route-preview .qr-footer p{width:100%;font-size:12px;color:var(--qr-soft);line-height:1.8;margin-bottom:3px}
#qixia-route-preview .qr-product .qr-main{flex:1;background:var(--qr-red);color:light-dark(#fff,#2a1715);border-radius:13px;padding:12px 16px;font-size:14px}
#qixia-route-preview .qr-product .qr-secondary{font-size:12px;color:var(--qr-soft)}
#qixia-route-preview .qr-feedback{font-size:12px;color:var(--qr-red);line-height:1.8;margin-top:10px!important}
#qixia-route-preview .qr-product [hidden]{display:none!important}
#qixia-route-preview #qr-history-view{position:absolute;inset:90px 16px auto;padding:22px;background:var(--qr-bg);border:1px solid var(--qr-line);border-radius:18px;box-shadow:0 15px 50px #00000025;z-index:3}
#qixia-route-preview .qr-history-heading{display:flex;align-items:center;justify-content:space-between}
#qixia-route-preview .qr-memory{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
#qixia-route-preview .qr-memory button{background:var(--qr-tint);border-radius:12px;flex:1;padding:12px;font-size:13px}
#qixia-route-preview #qr-history-view p{font-size:13px;color:var(--qr-soft);line-height:1.8;margin-top:10px}
@media(max-width:420px){#qixia-route-preview .qr-stage{padding:12px 0}#qixia-route-preview .qr-product{padding:18px 14px}#qixia-route-preview .qr-stop{column-gap:5px}#qixia-route-preview .qr-title h3{font-size:22px}}
</style>
<script>
(()=>{
const root=document.getElementById('qixia-route-preview');
const el=id=>root.querySelector('#'+id);
const stops=[{name:'西门',note:'从这里开启这一程',icon:'arrow-right'},{name:'明镜湖',note:'湖畔漫步',stay:20},{name:'栖霞寺',note:'古刹寻幽',stay:40},{name:'舍利塔',note:'石刻与古建',stay:20},{name:'西门',note:'返回出发的门',icon:'flag'}];
let mode='official',selected=-1,next=2,editing=false,skipped=[];
function restore(saved){const s=saved?.privateContent;if(s&&['official','custom','active'].includes(s.mode)){mode=s.mode;next=Number.isInteger(s.next)?Math.max(1,Math.min(5,s.next)):2;selected=Number.isInteger(s.selected)?s.selected:-1;editing=Boolean(s.editing);skipped=Array.isArray(s.skipped)?s.skipped:[];}}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:mode,style:'左侧连续色条与景点节点'},privateContent:{mode,next,selected,editing,skipped}}).catch(()=>{});}
function render(){
 el('qr-mode').value=mode;
 root.querySelectorAll('[data-mode]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.mode===(mode==='official'?'official':'custom')));b.disabled=mode==='active';});
 el('qr-category').textContent=mode==='official'?'官方推荐 · 路线详情':mode==='custom'?'专属路线 · 已规划':'这一程，正在发生';
 el('qr-description').textContent=mode==='official'?'从湖畔走进古刹，把山里的风景慢慢串起来。':mode==='custom'?'已按规划顺序排列，起点和终点都是你选择的门。':'沿着这条线，看看走过哪里、下一站去哪里。';
 el('qr-list-title').textContent=mode==='official'?'沿途风景':mode==='custom'?'这一程的顺序':'游览进度';
 el('qr-count').textContent=mode==='active'?(next>=5?'已处理全部停靠点':'下一站 · '+stops[next].name):'西门 → 西门';
 el('qr-edit').hidden=mode!=='custom';el('qr-edit').textContent=editing?'完成编辑':'编辑停留时间';
 el('qr-count').hidden=mode==='custom';
 el('qr-stops').innerHTML=stops.map((s,i)=>{
 const done=mode==='active'&&i<next,up=mode==='active'&&i===next,future=mode==='active'&&i>next,skip=skipped.includes(i)&&mode==='active';
 const gate=i===0||i===4;
 const status=skip?'已跳过':done?'已手动确认':up?'下一站':i===0?'起点':i===4?'终点':'';
 const icon=done&&!skip?'check':gate?s.icon:null;
 return `<li class="qr-stop ${i===0?'is-start':''} ${i===4?'is-end':''} ${done?'is-done':''} ${up?'is-next':''} ${future?'is-future':''} ${selected===i?'is-selected':''}"><div class="qr-rail ${gate?'is-gate':''}"><span class="qr-dot">${icon?`<i data-lucide="${icon}" aria-hidden="true"></i>`:''}</span></div><div class="qr-stop-body"><div class="qr-stop-top"><button class="qr-name" data-stop="${i}" aria-pressed="${selected===i}">${s.name}</button><span class="qr-status">${status}</span></div><p class="qr-stop-note">${s.note}${s.stay?' · 建议停留 '+s.stay+' 分钟':''}</p>${editing&&mode==='custom'&&!gate?`<label class="qr-stay">停留时间<select data-stay="${i}" aria-label="${s.name}停留时间">${[10,20,30,40,60].map(v=>`<option value="${v}" ${v===s.stay?'selected':''}>${v} 分钟</option>`).join('')}</select></label>`:!gate?`<button class="qr-intro" data-intro="${i}">查看地点介绍 <i data-lucide="arrow-up-right" aria-hidden="true"></i></button>`:''}</div></li>`;
 }).join('');
 el('qr-hint').textContent=mode==='official'?'添加后可以调整停留时间，再规划这一程。':mode==='custom'?'首尾固定为所选出入口，完整顺序直接展示。':'到访进度由你手动确认；浅色节点为后续地点。';
 el('qr-action').textContent=mode==='official'?'添加到专属路线':mode==='custom'?'开始游览':next>=5?'结束游览并查看历史行程':'我已到达 · '+stops[next].name;
 el('qr-skip').hidden=mode!=='active'||next>=5;
 if(globalThis.lucide)lucide.createIcons();
}
function switchMode(value){mode=value;editing=false;selected=-1;el('qr-feedback').textContent='';el('qr-history-view').hidden=true;render();save();}
el('qr-mode').addEventListener('change',e=>switchMode(e.target.value));
root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>switchMode(b.dataset.mode)));
el('qr-edit').onclick=()=>{editing=!editing;render();save();};
el('qr-stops').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.stop!==undefined){selected=Number(b.dataset.stop);render();el('qr-feedback').textContent='已选中 '+stops[selected].name+' · 正式页面可联动地图对应点';save();}else if(b.dataset.intro!==undefined){el('qr-feedback').textContent=stops[Number(b.dataset.intro)].name+' · 正式页面打开现有景点介绍';}});
el('qr-stops').addEventListener('change',e=>{if(e.target.dataset.stay!==undefined){stops[Number(e.target.dataset.stay)].stay=Number(e.target.value);render();}});
el('qr-action').onclick=()=>{if(mode==='official')switchMode('custom');else if(mode==='custom'){next=1;skipped=[];switchMode('active');}else if(next<5){next++;render();save();}else{el('qr-history-view').hidden=false;}};
el('qr-skip').onclick=()=>{skipped.push(next);next++;render();save();};
root.querySelector('.qr-history').onclick=()=>{el('qr-history-view').hidden=false;};
el('qr-close-history').onclick=()=>{el('qr-history-view').hidden=true;};
root.querySelectorAll('[data-memory]').forEach(b=>b.onclick=()=>{el('qr-memory-feedback').textContent='正式页面将打开这次行程的'+b.dataset.memory;});
restore(window.openai?.widgetState);render();
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
if(globalThis.Tweak){const appearance={lineWidth:3,spacing:22};const product=root.querySelector('.qr-product');const tweak=new Tweak({container:product,onChange:()=>{product.style.setProperty('--qr-track',appearance.lineWidth+'px');product.style.setProperty('--qr-gap',appearance.spacing+'px');}});tweak.addSlider(appearance,'lineWidth',{label:'连接线粗细',min:2,max:6,unit:'px'});tweak.addSlider(appearance,'spacing',{label:'景点间距',min:12,max:32,unit:'px'});}
})();
</script>
